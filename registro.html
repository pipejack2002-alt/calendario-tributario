<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear cuenta - Calendario Tributario</title>
</head>
<body>
  <h1>Crear cuenta</h1>
  <form id="form-registro">
    <label>Correo</label><br>
    <input type="email" id="email" required><br>
    <label>Contraseña</label><br>
    <input type="password" id="password" required minlength="6"><br>
    <button type="submit">Crear cuenta</button>
  </form>
  <p id="mensaje"></p>
  <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script>
    const form = document.getElementById('form-registro');
    const mensaje = document.getElementById('mensaje');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabaseClient.auth.signUp({ email, password });

      if (error) {
        mensaje.textContent = "Error: " + error.message;
        return;
      }

      await supabaseClient.from('perfiles').insert({
        id: data.user.id,
        email: email,
        rol: 'usuario'
      });

      mensaje.textContent = "¡Cuenta creada! Ya puedes iniciar sesión.";
      form.reset();
    });
  </script>
</body>
</html>

name: Enviar Alertas Tributarias Diarias
on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta automáticamente todos los días a las 8:00 AM
  workflow_dispatch:     # Activa el botón de ejecución manual en GitHub
jobs:
  run-alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la Edge Function de Supabase
        run: |
          curl -X POST https://lehtlxevhzhxohhvjfsf.supabase.co/functions/v1/super-handler \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"